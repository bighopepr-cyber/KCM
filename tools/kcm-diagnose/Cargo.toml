[package]
name = "kcm-diagnose"
version = "0.1.0"
edition = "2021"
description = "Diagnostics tool for KCM Knowledge Columnar Model"
license = "MIT"

[[bin]]
name = "kcm-diagnose"
path = "src/main.rs"

[dependencies]
kcm-core = { path = "../../crates/kcm-core" }
kcm-runtime = { path = "../../crates/kcm-runtime" }
clap = { version = "4", features = ["derive"] }
anyhow = "1.0"
colored = "2.0"
serde_json = "1.0"
