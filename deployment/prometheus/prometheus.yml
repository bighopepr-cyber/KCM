global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: 'kcm-server'
    static_configs:
      - targets: ['kcm:8080']
    metrics_path: '/metrics'
    scrape_interval: 10s

  - job_name: 'kcm-gRPC'
    static_configs:
      - targets: ['kcm:50051']
    scrape_interval: 30s

alerting:
  alertmanagers:
    - static_configs:
        - targets: ['alertmanager:9093']

rule_files:
  - 'kcm_alerts.yml'
