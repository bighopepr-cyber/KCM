apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: kcm-server
spec:
  serviceName: kcm-service
  replicas: 1
  selector:
    matchLabels:
      app: kcm-server
  template:
    metadata:
      labels:
        app: kcm-server
    spec:
      containers:
      - name: kcm-server
        image: kcm:latest
        ports:
        - containerPort: 8080
          name: http
        env:
        - name: RUST_LOG
          value: "info"
        - name: KCM_DATA_PATH
          value: "/data/kcm.db"
        resources:
          requests:
            memory: "512Mi"
            cpu: "500m"
          limits:
            memory: "2Gi"
            cpu: "2000m"
        volumeMounts:
        - name: data
          mountPath: /data
        livenessProbe:
          httpGet:
            path: /health
            port: 8080
          initialDelaySeconds: 10
          periodSeconds: 10
        readinessProbe:
          httpGet:
            path: /health
            port: 8080
          initialDelaySeconds: 5
          periodSeconds: 5
  volumeClaimTemplates:
  - metadata:
      name: data
    spec:
      accessModes: ["ReadWriteOnce"]
      resources:
        requests:
          storage: 100Gi
---
apiVersion: v1
kind: Service
metadata:
  name: kcm-service
spec:
  selector:
    app: kcm-server
  ports:
  - name: http
    port: 8080
    targetPort: 8080
  type: LoadBalancer
