[package]
name = "kcm-cli"
version = "0.1.0"
edition = "2021"
description = "Command-line interface for KCM Knowledge Columnar Model"
license = "MIT"

[[bin]]
name = "kcm"
path = "src/main.rs"

[dependencies]
kcm-core = { path = "../../crates/kcm-core" }
kcm-storage = { path = "../../crates/kcm-storage" }
kcm-runtime = { path = "../../crates/kcm-runtime" }
kcm-interface = { path = "../../crates/kcm-interface" }
clap = { version = "4", features = ["derive"] }
serde_json = "1.0"
anyhow = "1.0"
colored = "2.0"
