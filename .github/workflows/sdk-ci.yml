name: SDK CI

on:
  push:
    branches: [main]
    paths:
      - 'sdk/**'
      - 'crates/kcm-interface/**'
      - '.github/workflows/sdk-ci.yml'
  pull_request:
    branches: [main]
    paths:
      - 'sdk/**'
      - 'crates/kcm-interface/**'
      - '.github/workflows/sdk-ci.yml'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: "-D warnings"

jobs:
  rust-sdk:
    name: Rust SDK
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target/
          key: ${{ runner.os }}-rust-sdk-${{ hashFiles('sdk/rust/Cargo.toml') }}
          restore-keys: ${{ runner.os }}-rust-sdk-
      - name: Lint
        run: cargo clippy --all-targets -- -D warnings
        working-directory: sdk/rust
      - name: Format
        run: cargo fmt --all -- --check
        working-directory: sdk/rust
      - name: Build
        run: cargo build --workspace
        working-directory: sdk/rust
      - name: Test
        run: cargo test --workspace
        working-directory: sdk/rust

  python-sdk:
    name: Python SDK
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
        working-directory: sdk/python
      - name: Lint (ruff)
        run: ruff check src/ tests/
        working-directory: sdk/python
      - name: Type check (mypy)
        run: mypy src/
        working-directory: sdk/python
      - name: Test
        run: pytest tests/ -v --tb=short
        working-directory: sdk/python

  javascript-sdk:
    name: JavaScript SDK
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: sdk/javascript/package-lock.json
      - name: Install dependencies
        run: npm ci
        working-directory: sdk/javascript
      - name: Lint
        run: npm run lint
        working-directory: sdk/javascript
      - name: Test
        run: npm test
        working-directory: sdk/javascript

  typescript-sdk:
    name: TypeScript SDK
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: sdk/typescript/package-lock.json
      - name: Install dependencies
        run: npm ci
        working-directory: sdk/typescript
      - name: Type check
        run: npx tsc --noEmit
        working-directory: sdk/typescript
      - name: Lint
        run: npm run lint
        working-directory: sdk/typescript
      - name: Test
        run: npm test
        working-directory: sdk/typescript

  go-sdk:
    name: Go SDK
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.22'
      - name: Build
        run: go build ./...
        working-directory: sdk/go
      - name: Vet
        run: go vet ./...
        working-directory: sdk/go
      - name: Format check
        run: test -z "$(gofmt -l .)"
        working-directory: sdk/go
      - name: Test
        run: go test -v ./...
        working-directory: sdk/go

  java-sdk:
    name: Java SDK
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven
      - name: Compile
        run: mvn compile -q
        working-directory: sdk/java
      - name: Test
        run: mvn test -q
        working-directory: sdk/java

  dotnet-sdk:
    name: .NET SDK
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Build
        run: dotnet build --configuration Release
        working-directory: sdk/dotnet
      - name: Test
        run: dotnet test --configuration Release --no-build
        working-directory: sdk/dotnet

  c-sdk:
    name: C SDK
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Install build tools
        run: sudo apt-get update && sudo apt-get install -y build-essential
      - name: Build
        run: make
        working-directory: sdk/c
      - name: Test
        run: make test
        working-directory: sdk/c

  cpp-sdk:
    name: C++ SDK
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Install build tools
        run: sudo apt-get update && sudo apt-get install -y build-essential cmake
      - name: Configure
        run: cmake -B build -DCMAKE_BUILD_TYPE=Release
        working-directory: sdk/cpp
      - name: Build
        run: cmake --build build
        working-directory: sdk/cpp
      - name: Test
        run: ctest --test-dir build --output-on-failure
        working-directory: sdk/cpp

  ssot-validation:
    name: SSOT Validation
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - run: bash scripts/validate-ssot.sh

  sdk-api-validation:
    name: SDK API Validation
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - run: bash scripts/validate-sdk-api.sh

  quality-gate:
    name: SDK Quality Gate
    runs-on: ubuntu-latest
    needs:
      - rust-sdk
      - python-sdk
      - javascript-sdk
      - typescript-sdk
      - go-sdk
      - java-sdk
      - dotnet-sdk
      - c-sdk
      - cpp-sdk
      - ssot-validation
      - sdk-api-validation
    steps:
      - run: echo "All SDK quality gates passed"
