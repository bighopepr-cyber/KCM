name: KCM CI/CD Pipeline

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: Build & Format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: Format Check
        run: cargo fmt --all -- --check
      - name: Build
        run: cargo build --workspace
      - name: Build Release
        run: cargo build --release --workspace

  clippy:
    name: Clippy Linting
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - name: Clippy
        run: cargo clippy --workspace -- -D warnings

  unit-tests:
    name: Unit Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Run Unit Tests
        run: cargo test --lib --all
      - name: Run Inline Tests
        run: cargo test --workspace

  integration-tests:
    name: Integration Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Run Integration Tests
        run: cargo test --test '*' --all

  property-tests:
    name: Property-Based Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Run Property Tests
        run: cargo test property_tests --all

  security-tests:
    name: Security Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Run Security Tests
        run: cargo test security_tests --all

  load-tests:
    name: Load Tests
    runs-on: ubuntu-latest
    needs: [unit-tests]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Run Load Tests
        run: cargo test load_tests --all -- --nocapture

  stress-tests:
    name: Stress Tests
    runs-on: ubuntu-latest
    needs: [unit-tests]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Run Stress Tests
        run: cargo test stress_tests --all -- --nocapture

  benchmarks:
    name: Performance Benchmarks
    runs-on: ubuntu-latest
    needs: [unit-tests]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Build Benchmarks
        run: cargo bench --workspace --no-run

  regression-tests:
    name: Regression Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Run Regression Tests
        run: cargo test regression_detector --all -- --nocapture

  metrics:
    name: Testing Metrics
    runs-on: ubuntu-latest
    needs: [unit-tests, integration-tests, security-tests]
    if: always()
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Run Metrics Dashboard Tests
        run: cargo test metrics_dashboard --all -- --nocapture

  quality-gate:
    name: Quality Gate
    runs-on: ubuntu-latest
    needs: [build, clippy, unit-tests, integration-tests, property-tests, security-tests]
    if: always()
    steps:
      - name: Check Results
        run: |
          if [ "${{ needs.build.result }}" != "success" ]; then echo "Build failed"; exit 1; fi
          if [ "${{ needs.clippy.result }}" != "success" ]; then echo "Clippy failed"; exit 1; fi
          if [ "${{ needs.unit-tests.result }}" != "success" ]; then echo "Unit tests failed"; exit 1; fi
          if [ "${{ needs.integration-tests.result }}" != "success" ]; then echo "Integration tests failed"; exit 1; fi
          if [ "${{ needs.property-tests.result }}" != "success" ]; then echo "Property tests failed"; exit 1; fi
          if [ "${{ needs.security-tests.result }}" != "success" ]; then echo "Security tests failed"; exit 1; fi
          echo "All quality gates passed"
