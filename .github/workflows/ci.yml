name: KCM CI/CD Pipeline

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: "-D warnings"

jobs:
  format:
    name: Format Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt --all -- --check

  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --workspace
      - run: cargo build --release --workspace

  clippy:
    name: Clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo clippy --workspace -- -D warnings

  unit-tests:
    name: Unit Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --lib --all
      - run: cargo test --workspace

  integration-tests:
    name: Integration Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --test '*' --all

  security-tests:
    name: Security Tests
    runs-on: ubuntu-latest
    needs: [unit-tests]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo test security_tests --all -- --nocapture

  load-tests:
    name: Load Tests
    runs-on: ubuntu-latest
    needs: [unit-tests]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo test load_tests --all -- --nocapture

  stress-tests:
    name: Stress Tests
    runs-on: ubuntu-latest
    needs: [unit-tests]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo test stress_tests --all -- --nocapture

  benchmarks:
    name: Benchmarks (compile only)
    runs-on: ubuntu-latest
    needs: [unit-tests]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo bench --workspace --no-run

  recovery-tests:
    name: Recovery Tests
    runs-on: ubuntu-latest
    needs: [unit-tests]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo test recovery --all -- --nocapture

  quality-gate:
    name: Quality Gate
    runs-on: ubuntu-latest
    needs: [format, build, clippy, unit-tests, integration-tests, security-tests, load-tests, stress-tests, recovery-tests]
    if: always() && !cancelled()
    steps:
      - name: Check all jobs passed
        run: |
          echo "Format: ${{ needs.format.result }}"
          echo "Build: ${{ needs.build.result }}"
          echo "Clippy: ${{ needs.clippy.result }}"
          echo "Unit: ${{ needs.unit-tests.result }}"
          echo "Integration: ${{ needs.integration-tests.result }}"
          echo "Security: ${{ needs.security-tests.result }}"
          echo "Load: ${{ needs.load-tests.result }}"
          echo "Stress: ${{ needs.stress-tests.result }}"
          echo "Recovery: ${{ needs.recovery-tests.result }}"
          if [ "${{ needs.format.result }}" != "success" ]; then exit 1; fi
          if [ "${{ needs.build.result }}" != "success" ]; then exit 1; fi
          if [ "${{ needs.clippy.result }}" != "success" ]; then exit 1; fi
          if [ "${{ needs.unit-tests.result }}" != "success" ]; then exit 1; fi
          if [ "${{ needs.integration-tests.result }}" != "success" ]; then exit 1; fi
          if [ "${{ needs.security-tests.result }}" != "success" ]; then exit 1; fi
          if [ "${{ needs.load-tests.result }}" != "success" ]; then exit 1; fi
          if [ "${{ needs.stress-tests.result }}" != "success" ]; then exit 1; fi
          if [ "${{ needs.recovery-tests.result }}" != "success" ]; then exit 1; fi
          echo "All quality gates passed"
