name: Full CI Pipeline

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1
  RUSTFLAGS: "-D warnings"

jobs:
  quality:
    name: Quality Gates
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      
      - name: Cache dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target/
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-
      
      - name: Format check
        run: cargo fmt --all -- --check
      
      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings
      
      - name: Build
        run: cargo build --workspace
      
      - name: Build release
        run: cargo build --release --workspace

  test:
    name: Tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: quality
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      
      - name: Cache dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target/
          key: ${{ runner.os }}-test-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-test-
      
      - name: Unit tests
        run: cargo test --workspace --lib
      
      - name: Integration tests
        run: cargo test --workspace --test '*'
      
      - name: Property tests
        run: cargo test property_tests --workspace -- --nocapture

  stress:
    name: Stress Tests
    runs-on: ubuntu-latest
    timeout-minutes: 60
    needs: test
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      
      - name: Cache dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target/
          key: ${{ runner.os }}-test-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-test-
      
      - name: Stress tests
        run: cargo test test_stress --workspace -- --nocapture
      
      - name: Soak tests
        run: cargo test test_soak --workspace -- --nocapture

  benchmark:
    name: Benchmarks
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: test
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      
      - name: Cache dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target/
          key: ${{ runner.os }}-bench-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-bench-
      
      - name: Run benchmarks
        run: cargo bench --workspace 2>&1 | tee benchmark-results/ci-output.txt
      
      - name: Upload benchmark results
        uses: actions/upload-artifact@v4
        with:
          name: benchmark-results
          path: benchmark-results/
          retention-days: 90

  cli-tools:
    name: CLI Integration Tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: quality
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      
      - name: Cache dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target/
          key: ${{ runner.os }}-cli-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cli-
      
      - name: Build CLI tools
        run: cargo build --workspace --release
      
      - name: Test kcm-cli
        run: cargo run --release -p kcm-cli -- version
      
      - name: Test kcm-doctor
        run: cargo run --release -p kcm-doctor -- check
      
      - name: Test kcm-bench
        run: cargo run --release -p kcm-bench -- run
      
      - name: Test kcm-inspect
        run: cargo run --release -p kcm-inspect -- schema
      
      - name: Test kcm-migrate
        run: cargo run --release -p kcm-migrate -- status

  docker:
    name: Docker Build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: [quality, test]
    steps:
      - uses: actions/checkout@v4
      - name: Build Docker image
        run: docker build -t kcm:test -f deployment/Dockerfile .
      - name: Test Docker image
        run: |
          docker run -d --name kcm-test -p 8080:8080 kcm:test
          for i in $(seq 1 10); do
            if curl -sf http://localhost:8080/health > /dev/null 2>&1; then
              echo "Health check passed"
              docker stop kcm-test
              exit 0
            fi
            sleep 1
          done
          echo "Health check failed"
          docker logs kcm-test
          docker stop kcm-test
          exit 1

  cargo-audit:
    name: Cargo Audit
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target/
          key: ${{ runner.os }}-audit-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-audit-
      - uses: rustsec/audit-check@v2.0.0
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

  cargo-deny:
    name: Cargo Deny
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check all
          arguments: --all-features

  performance-regression:
    name: Performance Regression Check
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: [quality, test]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Cache dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target/
          key: ${{ runner.os }}-bench-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-bench-
      - name: Run benchmarks
        run: cargo bench --workspace 2>&1 | tee benchmark-results/current.txt
      - name: Check for regressions
        if: hashFiles('benchmark-results/baseline.json') != ''
        run: python3 scripts/bench-regression.py benchmark-results/baseline.json benchmark-results/ || echo "Regression check completed (non-blocking)"

  ssot-validation:
    name: SSOT Validation
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - run: bash scripts/validate-ssot.sh

  quality-gate:
    name: Quality Gate
    runs-on: ubuntu-latest
    needs: [quality, test, stress, benchmark, cli-tools, docker, cargo-audit, cargo-deny, performance-regression, ssot-validation]
    steps:
      - run: echo "All quality gates passed — ready for review"
