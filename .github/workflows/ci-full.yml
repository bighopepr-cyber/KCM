name: Full CI Pipeline

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1
  RUSTFLAGS: "-D warnings"

jobs:
  quality:
    name: Quality Gates
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      
      - name: Cache dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target/
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-
      
      - name: Format check
        run: cargo fmt --all -- --check
      
      - name: Clippy
        run: cargo clippy --workspace -- -D warnings
      
      - name: Build
        run: cargo build --workspace
      
      - name: Build release
        run: cargo build --release --workspace

  test:
    name: Tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: quality
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      
      - name: Cache dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target/
          key: ${{ runner.os }}-test-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-test-
      
      - name: Unit tests
        run: cargo test --workspace --lib
      
      - name: Integration tests
        run: cargo test --workspace --test '*'
      
      - name: Property tests
        run: cargo test property_tests --workspace -- --nocapture

  stress:
    name: Stress Tests
    runs-on: ubuntu-latest
    timeout-minutes: 60
    needs: test
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      
      - name: Cache dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target/
          key: ${{ runner.os }}-test-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-test-
      
      - name: Stress tests
        run: cargo test test_stress --workspace -- --nocapture
      
      - name: Soak tests
        run: cargo test test_soak --workspace -- --nocapture

  benchmark:
    name: Benchmarks
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: test
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      
      - name: Cache dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target/
          key: ${{ runner.os }}-bench-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-bench-
      
      - name: Run benchmarks
        run: cargo bench --workspace 2>&1 | tee benchmark-results/ci-output.txt
      
      - name: Upload benchmark results
        uses: actions/upload-artifact@v4
        with:
          name: benchmark-results
          path: benchmark-results/
          retention-days: 90

  cli-tools:
    name: CLI Integration Tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: quality
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      
      - name: Cache dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target/
          key: ${{ runner.os }}-cli-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cli-
      
      - name: Build CLI tools
        run: cargo build --workspace --release
      
      - name: Test kcm-cli
        run: cargo run --release -p kcm-cli -- version
      
      - name: Test kcm-doctor
        run: cargo run --release -p kcm-doctor -- check
      
      - name: Test kcm-bench
        run: cargo run --release -p kcm-bench -- run
      
      - name: Test kcm-inspect
        run: cargo run --release -p kcm-inspect -- schema
      
      - name: Test kcm-migrate
        run: cargo run --release -p kcm-migrate -- status

  docker:
    name: Docker Build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: [quality, test]
    permissions:
      contents: read
      packages: write
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - name: Build Docker image
        run: docker build -t kcm:test -f deployment/Dockerfile .
      - name: Tag Docker image
        if: github.ref == 'refs/heads/main'
        run: |
          VERSION=$(date +%Y%m%d)-$(echo ${{ github.sha }} | cut -c1-7)
          docker tag kcm:test kcm/kcm-server:${VERSION}
          docker tag kcm:test kcm/kcm-server:latest
          echo "IMAGE_TAG=${VERSION}" >> $GITHUB_ENV
      - name: Test Docker image
        run: |
          docker run -d --name kcm-test -p 8080:8080 kcm:test
          for i in $(seq 1 10); do
            if curl -sf http://localhost:8080/health > /dev/null 2>&1; then
              echo "Health check passed"
              docker stop kcm-test
              exit 0
            fi
            sleep 1
          done
          echo "Health check failed"
          docker logs kcm-test
          docker stop kcm-test
          exit 1
      - name: Install cosign
        if: github.ref == 'refs/heads/main'
        uses: sigstore/cosign-installer@v3
      - name: Sign Docker image with SigStore
        if: github.ref == 'refs/heads/main'
        run: |
          docker tag kcm:test kcm/kcm-server:${{ github.sha }}
          docker tag kcm:test kcm/kcm-server:latest
          cosign sign --yes kcm/kcm-server:${{ github.sha }} || echo "SigStore signing skipped (no keyless identity)"
      - name: Generate SBOM
        if: github.ref == 'refs/heads/main'
        run: |
          docker run --rm \
            -v /var/run/docker.sock:/var/run/docker.sock \
            anchore/syft:latest \
            kcm:test -o cyclonedx-json=sbom-cyclonedx.json
      - name: Upload SBOM
        if: github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@v4
        with:
          name: sbom
          path: sbom-cyclonedx.json
          retention-days: 90

  performance-regression:
    name: Performance Regression Check
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: [quality, test]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Cache dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target/
          key: ${{ runner.os }}-bench-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-bench-
      - name: Run benchmarks
        run: cargo bench --workspace 2>&1 | tee benchmark-results/current.txt
      - name: Check for regressions
        run: python3 scripts/bench-regression.py benchmark-results/baseline.json benchmark-results/ || echo "Regression check completed (non-blocking)"

  ssot-validation:
    name: SSOT Validation
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - run: bash scripts/validate-ssot.sh
