name: SDK Publish

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write
  packages: write

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: "-D warnings"

jobs:
  validate:
    name: Validate Release
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - name: Extract version
        id: version
        run: echo "version=${GITHUB_REF#refs/tags/v}" >> "$GITHUB_OUTPUT"
      - name: Validate tag format
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          if [[ ! "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "ERROR: Invalid version format: $VERSION (expected X.Y.Z)"
            exit 1
          fi

  build-and-test:
    name: Build & Test (${{ matrix.sdk }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: validate
    strategy:
      fail-fast: false
      matrix:
        include:
          - sdk: rust
            language: rust
          - sdk: python
            language: python
          - sdk: javascript
            language: javascript
          - sdk: typescript
            language: typescript
          - sdk: go
            language: go
          - sdk: java
            language: java
          - sdk: dotnet
            language: dotnet
          - sdk: c
            language: c
          - sdk: cpp
            language: cpp
    steps:
      - uses: actions/checkout@v4

      - name: Setup Rust
        if: matrix.language == 'rust'
        uses: dtolnay/rust-toolchain@stable

      - name: Setup Python
        if: matrix.language == 'python'
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Setup Node.js
        if: matrix.language == 'javascript' || matrix.language == 'typescript'
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Setup Go
        if: matrix.language == 'go'
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'

      - name: Setup Java
        if: matrix.language == 'java'
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: Setup .NET
        if: matrix.language == 'dotnet'
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Install build tools (C/C++)
        if: matrix.language == 'c' || matrix.language == 'cpp'
        run: sudo apt-get update && sudo apt-get install -y build-essential cmake

      - name: Build & Test (Rust)
        if: matrix.language == 'rust'
        working-directory: sdk/rust
        run: |
          cargo build --release
          cargo test --workspace

      - name: Build & Test (Python)
        if: matrix.language == 'python'
        working-directory: sdk/python
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
          ruff check src/ tests/
          mypy src/
          pytest tests/ -v

      - name: Build & Test (JavaScript)
        if: matrix.language == 'javascript'
        working-directory: sdk/javascript
        run: |
          npm ci
          npm run lint
          npm test

      - name: Build & Test (TypeScript)
        if: matrix.language == 'typescript'
        working-directory: sdk/typescript
        run: |
          npm ci
          npx tsc --noEmit
          npm run lint
          npm test

      - name: Build & Test (Go)
        if: matrix.language == 'go'
        working-directory: sdk/go
        run: |
          go build ./...
          go vet ./...
          go test -v ./...

      - name: Build & Test (Java)
        if: matrix.language == 'java'
        working-directory: sdk/java
        run: |
          mvn compile -q
          mvn test -q

      - name: Build & Test (.NET)
        if: matrix.language == 'dotnet'
        working-directory: sdk/dotnet
        run: |
          dotnet build --configuration Release
          dotnet test --configuration Release --no-build

      - name: Build & Test (C)
        if: matrix.language == 'c'
        working-directory: sdk/c
        run: |
          make
          make test

      - name: Build & Test (C++)
        if: matrix.language == 'cpp'
        working-directory: sdk/cpp
        run: |
          cmake -B build -DCMAKE_BUILD_TYPE=Release
          cmake --build build
          ctest --test-dir build --output-on-failure

  publish-rust:
    name: Publish Rust SDK
    runs-on: ubuntu-latest
    needs: [validate, build-and-test]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Publish to crates.io
        working-directory: sdk/rust
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CRATES_IO_TOKEN }}
        run: cargo publish --allow-dirty

  publish-python:
    name: Publish Python SDK
    runs-on: ubuntu-latest
    needs: [validate, build-and-test]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Build package
        working-directory: sdk/python
        run: |
          python -m pip install --upgrade pip build
          python -m build
      - name: Publish to PyPI
        working-directory: sdk/python
        env:
          TWINE_USERNAME: __token__
          TWINE_PASSWORD: ${{ secrets.PYPI_TOKEN }}
        run: |
          python -m pip install twine
          twine upload dist/*

  publish-npm:
    name: Publish JS/TS SDKs
    runs-on: ubuntu-latest
    needs: [validate, build-and-test]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          registry-url: 'https://registry.npmjs.org'
      - name: Publish JavaScript SDK
        working-directory: sdk/javascript
        run: npm publish --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
      - name: Publish TypeScript SDK
        working-directory: sdk/typescript
        run: npm publish --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

  publish-maven:
    name: Publish Java SDK
    runs-on: ubuntu-latest
    needs: [validate, build-and-test]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          server-id: ossrh
          server-username: MAVEN_USERNAME
          server-password: MAVEN_PASSWORD
          gpg-private-key: ${{ secrets.GPG_PRIVATE_KEY }}
          gpg-passphrase: MAVEN_GPG_PASSPHRASE
      - name: Publish to Maven Central
        working-directory: sdk/java
        env:
          MAVEN_USERNAME: ${{ secrets.OSSRH_USERNAME }}
          MAVEN_PASSWORD: ${{ secrets.OSSRH_PASSWORD }}
          MAVEN_GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}
        run: mvn deploy -q -DskipTests

  publish-nuget:
    name: Publish .NET SDK
    runs-on: ubuntu-latest
    needs: [validate, build-and-test]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Pack
        working-directory: sdk/dotnet
        run: dotnet pack --configuration Release --output ./nupkg
      - name: Publish to NuGet
        working-directory: sdk/dotnet
        run: dotnet nuget push ./nupkg/*.nupkg --source https://api.nuget.org/v3/index.json --api-key ${{ secrets.NUGET_TOKEN }} --skip-duplicate

  release-notes:
    name: Generate Release Notes
    runs-on: ubuntu-latest
    needs: [validate, publish-rust, publish-python, publish-npm, publish-maven, publish-nuget]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Generate notes
        id: notes
        run: |
          PREV_TAG=$(git tag --sort=-v:refname | head -2 | tail -1 || echo "")
          if [ -n "$PREV_TAG" ]; then
            CHANGES=$(git log --pretty=format:"- %s (%h)" "$PREV_TAG"..HEAD -- sdk/ crates/kcm-interface/)
          else
            CHANGES=$(git log --pretty=format:"- %s (%h)" -- sdk/ crates/kcm-interface/)
          fi
          echo "changes<<EOF" >> "$GITHUB_OUTPUT"
          echo "$CHANGES" >> "$GITHUB_OUTPUT"
          echo "EOF" >> "$GITHUB_OUTPUT"
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: KCM SDK ${{ needs.validate.outputs.version }}
          body: |
            ## KCM SDK ${{ needs.validate.outputs.version }}

            ### Published Packages

            | Language | Package | Registry |
            |----------|---------|----------|
            | Rust | kcm-core | [crates.io](https://crates.io/crates/kcm-core) |
            | Python | kcm | [PyPI](https://pypi.org/project/kcm/) |
            | JavaScript | @kcm/js | [npm](https://www.npmjs.com/package/@kcm/js) |
            | TypeScript | @kcm/ts | [npm](https://www.npmjs.com/package/@kcm/ts) |
            | Java | io.kcm:sdk | [Maven Central](https://central.sonatype.com/) |
            | .NET | Kcm.Sdk | [NuGet](https://www.nuget.org/packages/Kcm.Sdk/) |

            ### Changes

            ${{ steps.notes.outputs.changes }}
          draft: false
          prerelease: false
