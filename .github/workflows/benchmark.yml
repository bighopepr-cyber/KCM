name: Benchmark

on:
  workflow_dispatch:
  push:
    branches: [main]
  schedule:
    - cron: '0 6 * * 1'

env:
  CARGO_TERM_COLOR: always

jobs:
  benchmark:
    name: Performance Benchmarks
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt

      - uses: Swatinem/rust-cache@v2

      - name: Collect environment metadata
        run: |
          mkdir -p benchmark-results/metadata benchmark-results/raw benchmark-results/reports
          
          cat > benchmark-results/metadata/environment.json << 'ENVEOF'
          {
            "os": "ubuntu-latest",
            "cpu": "$(lscpu | grep 'Model name' | cut -d: -f2 | xargs)",
            "cores": $(nproc),
            "ram_mb": $(free -m | awk '/^Mem:/{print $2}'),
            "rust_version": "$(rustc --version)",
            "llvm_version": "$(llc --version | head -1)"
          }
          ENVEOF
          
          cat > benchmark-results/metadata/git.json << 'GITEOF'
          {
            "commit": "$(git rev-parse HEAD)",
            "branch": "$(git rev-parse --abbrev-ref HEAD)",
            "timestamp": "$(date -u +%Y-%m-%dT%H:%M:%SZ)",
            "message": "$(git log -1 --pretty=format:'%s')"
          }
          GITEOF
          
          cat > benchmark-results/metadata/benchmark-version.json << 'VEOF'
          {
            "benchmark_version": "1.0.0",
            "spec_version": "PRD-TESTING-2026",
            "criterion_version": "0.5"
          }
          VEOF

      - name: Build benchmarks
        run: cargo bench --workspace --no-run 2>&1 | tee benchmark-results/raw/build.log

      - name: Run benchmarks
        run: cargo bench --workspace 2>&1 | tee benchmark-results/raw/bench.log

      - name: Copy criterion results
        run: |
          if [ -d "target/criterion" ]; then
            cp -r target/criterion benchmark-results/raw/criterion-results
          fi

      - name: Generate benchmark report
        run: |
          python3 -c "
          import json, os, re

          bench_log = 'benchmark-results/raw/bench.log'
          report_lines = []
          report_lines.append('# KCM Benchmark Report')
          report_lines.append('')
          report_lines.append('## Environment')
          report_lines.append('')
          
          try:
              with open('benchmark-results/metadata/environment.json') as f:
                  env = json.load(f)
                  report_lines.append(f'- **OS**: {env.get(\"os\", \"unknown\")}')
                  report_lines.append(f'- **CPU**: {env.get(\"cpu\", \"unknown\")}')
                  report_lines.append(f'- **Cores**: {env.get(\"cores\", \"unknown\")}')
                  report_lines.append(f'- **RAM**: {env.get(\"ram_mb\", \"unknown\")} MB')
                  report_lines.append(f'- **Rust**: {env.get(\"rust_version\", \"unknown\")}')
          except: pass
          
          report_lines.append('')
          try:
              with open('benchmark-results/metadata/git.json') as f:
                  git = json.load(f)
                  report_lines.append(f'- **Commit**: {git.get(\"commit\", \"unknown\")}')
                  report_lines.append(f'- **Branch**: {git.get(\"branch\", \"unknown\")}')
                  report_lines.append(f'- **Timestamp**: {git.get(\"timestamp\", \"unknown\")}')
          except: pass

          report_lines.append('')
          report_lines.append('## Performance Results')
          report_lines.append('')
          report_lines.append('| Benchmark | Dataset | Duration | Throughput |')
          report_lines.append('|-----------|---------|----------|------------|')
          
          summary_data = []
          
          try:
              with open(bench_log) as f:
                  content = f.read()
                  pattern = r'(\S+)\s+(\d+\.\d+)\s+ns'
                  for match in re.finditer(pattern, content):
                      name = match.group(1)
                      ns = float(match.group(2))
                      if ns > 1_000_000_000:
                          dur = f'{ns/1_000_000_000:.2f} s'
                      elif ns > 1_000_000:
                          dur = f'{ns/1_000_000:.2f} ms'
                      elif ns > 1_000:
                          dur = f'{ns/1_000:.2f} us'
                      else:
                          dur = f'{ns:.0} ns'
                      throughput = f'{1_000_000_000.0/ns:.0} ops/s' if ns > 0 else 'N/A'
                      report_lines.append(f'| {name} | - | {dur} | {throughput} |')
                      summary_data.append({\"name\": name, \"duration_ns\": ns, \"throughput_ops_sec\": 1_000_000_000.0/ns if ns > 0 else 0})
          except: pass
          
          report_lines.append('')
          report_lines.append('## Summary')
          report_lines.append('')
          report_lines.append(f'- **Total benchmarks executed**: {len(summary_data)}')
          report_lines.append(f'- **Report generated**: $(date -u +%Y-%m-%dT%H:%M:%SZ)')
          report_lines.append('')
          
          os.makedirs('benchmark-results/reports', exist_ok=True)
          with open('benchmark-results/reports/KCM_BENCHMARK_REPORT.md', 'w') as f:
              f.write('\\n'.join(report_lines))
          
          json_summary = {
              \"benchmark_version\": \"1.0.0\",
              \"results\": summary_data,
              \"total_benchmarks\": len(summary_data),
          }
          with open('benchmark-results/reports/KCM_BENCHMARK_SUMMARY.json', 'w') as f:
              json.dump(json_summary, f, indent=2)
          
          with open('benchmark-results/reports/KCM_PERFORMANCE_MATRIX.csv', 'w') as f:
              f.write('benchmark,duration_ns,throughput_ops_sec\\n')
              for item in summary_data:
                  f.write(f'{item[\"name\"]},{item[\"duration_ns\"]},{item[\"throughput_ops_sec\"]:.0}\\n')
          "

      - name: Upload benchmark results
        uses: actions/upload-artifact@v4
        with:
          name: kcm-benchmark-results
          path: benchmark-results/
          retention-days: 90
          if-no-files-found: warn
