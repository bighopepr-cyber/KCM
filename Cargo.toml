[workspace]
members = [
    "crates/kcm-core",
    "crates/kcm-storage",
    "crates/kcm-compute",
    "crates/kcm-reasoning",
    "crates/kcm-optimizer",
    "crates/kcm-runtime",
    "crates/kcm-interface",
    "crates/kcm-distributed",
    "crates/kcm-ml",
    "crates/kcm-security",
    "crates/kcm-compliance",
    "crates/kcm-testing",
    "crates/kcm-server",
    "scripts/kcm-cli/kcm-cli",
    "scripts/kcm-cli/kcm-backup",
    "scripts/kcm-cli/kcm-doctor",
    "scripts/kcm-cli/kcm-restore",
    "scripts/kcm-cli/kcm-inspect",
    "scripts/kcm-cli/kcm-migrate",
    "scripts/kcm-cli/kcm-bench",
    "scripts/kcm-cli/kcm-export",
    "scripts/kcm-cli/kcm-import",
    "scripts/kcm-cli/kcm-compact",
    "scripts/kcm-cli/kcm-diagnose",
    "scripts/kcm-cli/kcm-snapshot",
    "scripts/kcm-cli/kcm-schema",
    "scripts/kcm-cli/kcm-cluster",
    "scripts/kcm-cli/kcm-perf",
    "scripts/kcm-cli/kcm-profile",
    "scripts/kcm-cli/kcm-docs",
]
exclude = [
    "examples/rust",
]

resolver = "2"

[workspace.dependencies]
parking_lot = "0.12"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
zstd = "0.13"
lz4 = "1.24"
blake3 = "1.5"
thiserror = "2.0"
log = "0.4"
env_logger = "0.11"
rayon = "1.7"
tokio = { version = "1.35", features = ["full"] }
pyo3 = { version = "0.22", features = ["extension-module"] }
actix-web = "4"
tonic = "0.12"
prost = "0.13"
aes-gcm = "0.10"
getrandom = "0.2"
tempfile = "3"
criterion = { version = "0.5", features = ["html_reports"] }
proptest = "1.0"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true

[profile.bench]
inherits = "release"
