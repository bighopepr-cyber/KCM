[workspace]
members = [
    "crates/kcm-core",
    "crates/kcm-storage",
    "crates/kcm-compute",
    "crates/kcm-reasoning",
    "crates/kcm-optimizer",
    "crates/kcm-runtime",
    "crates/kcm-interface",
    "crates/kcm-distributed",
    "crates/kcm-ml",
    "crates/kcm-security",
    "crates/kcm-compliance",
    "crates/kcm-testing",
    "crates/kcm-server",
]

resolver = "2"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true

[profile.bench]
inherits = "release"
