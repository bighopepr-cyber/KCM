[workspace]
members = [
    "crates/kcm-core",
    "crates/kcm-storage",
    "crates/kcm-compute",
    "crates/kcm-reasoning",
    "crates/kcm-optimizer",
    "crates/kcm-runtime",
    "crates/kcm-interface",
    "crates/kcm-distributed",
    "crates/kcm-ml",
    "crates/kcm-security",
    "crates/kcm-compliance",
    "crates/kcm-testing",
    "crates/kcm-server",
    "scripts/kcm-cli/kcm-cli",
    "scripts/kcm-cli/kcm-backup",
    "scripts/kcm-cli/kcm-doctor",
    "scripts/kcm-cli/kcm-restore",
    "scripts/kcm-cli/kcm-inspect",
    "scripts/kcm-cli/kcm-migrate",
    "scripts/kcm-cli/kcm-bench",
    "scripts/kcm-cli/kcm-export",
    "scripts/kcm-cli/kcm-import",
    "scripts/kcm-cli/kcm-compact",
    "scripts/kcm-cli/kcm-diagnose",
    "scripts/kcm-cli/kcm-snapshot",
    "scripts/kcm-cli/kcm-schema",
    "scripts/kcm-cli/kcm-cluster",
    "scripts/kcm-cli/kcm-perf",
    "scripts/kcm-cli/kcm-profile",
    "scripts/kcm-cli/kcm-docs",
]
exclude = [
    "examples/rust",
]

[workspace.package]
edition = "2024"
version = "0.1.0"
license = "MIT"
repository = "https://github.com/bighopepr-cyber/KCM"
description = "Knowledge Columnar Model — columnar knowledge representation, storage, query, and reasoning engine"
authors = ["KCM Contributors"]

[workspace.dependencies]
# Core dependencies
parking_lot = "0.12"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# Compression
zstd = "0.13"
lz4 = "1.24"

# Hashing
blake3 = "1.5"

# Error handling
thiserror = "2.0"

# Logging
log = "0.4"
env_logger = "0.11"

# Parallelism
rayon = "1.7"

# Async
tokio = { version = "1.35", features = ["full"] }

# Python bindings
pyo3 = { version = "0.22", features = ["extension-module", "auto-initialize"] }

# Web/HTTP
actix-web = "4"

# gRPC
tonic = "0.12"
prost = "0.13"
tonic-build = "0.12"
protoc-bin-vendored = "3"

# Crypto
aes-gcm = "0.10"
getrandom = "0.2"

# CLI
clap = { version = "4", features = ["derive"] }
anyhow = "1.0"
colored = "2.0"
chrono = "0.4"

# Testing/Dev
tempfile = "3"
criterion = { version = "0.5", features = ["html_reports"] }
proptest = "1.0"
static_assertions = "1.1"

[workspace.lints.rust]
unsafe_code = "allow"

[workspace.lints.clippy]
unwrap_used = "warn"
panic = "warn"
todo = "warn"
unimplemented = "warn"
dbg_macro = "warn"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true

[profile.bench]
inherits = "release"
