[package]
name = "kcm-core"
version = "0.1.0"
edition = "2021"
description = "Core types and data structures for KCM"

[dependencies]
parking_lot = "0.12"
serde = { version = "1.0", features = ["derive"], optional = true }

[dev-dependencies]
criterion = "0.5"
proptest = "1.0"
static_assertions = "1.1"

[features]
default = []
serialization = ["serde"]
