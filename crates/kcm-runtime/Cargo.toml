[package]
name = "kcm-runtime"
version = "0.1.0"
edition = "2021"
description = "Runtime and transaction layer for KCM"

[dependencies]
kcm-core = { path = "../kcm-core" }
kcm-storage = { path = "../kcm-storage" }
parking_lot = "0.12"
rayon = "1.7"
tokio = { version = "1.35", features = ["full"] }

[dev-dependencies]
criterion = "0.5"
tempfile = "3"
kcm-distributed = { path = "../kcm-distributed" }
kcm-reasoning = { path = "../kcm-reasoning" }
kcm-compute = { path = "../kcm-compute" }
kcm-testing = { path = "../kcm-testing" }

[[bench]]
name = "micro"
harness = false
