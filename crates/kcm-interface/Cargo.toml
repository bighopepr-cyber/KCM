[package]
name = "kcm-interface"
version = "0.1.0"
edition = "2021"
description = "C API and FFI interface for KCM"

[dependencies]
kcm-core = { path = "../kcm-core" }
kcm-storage = { path = "../kcm-storage" }
kcm-runtime = { path = "../kcm-runtime" }
kcm-security = { path = "../kcm-security" }
parking_lot = "0.12"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
pyo3 = { version = "0.20", features = ["extension-module"], optional = true }

[lib]
crate-type = ["lib", "cdylib"]

[features]
default = []
python = ["pyo3"]
